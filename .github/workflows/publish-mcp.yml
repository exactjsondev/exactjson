name: Publish exactjson-mcp

on:
  workflow_dispatch:
  push:
    tags:
      - "mcp-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --check mcp/index.mjs
      - working-directory: mcp
        run: npm pack --dry-run
      - working-directory: mcp
        run: npm publish --provenance --access public
